
name: Extract VINZX Project

on:
  push:
    paths:
      - "VINZX-XITERZ-Full-System.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/vinzx
          unzip -q VINZX-XITERZ-Full-System.zip -d /tmp/vinzx
          cp -a /tmp/vinzx/VINZX-XITERZ-Full-System/. .
          rm -f VINZX-XITERZ-Full-System.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract VINZX project"
          git push
          
